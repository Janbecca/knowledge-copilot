name: Bug report
description: Report a reproducible defect without exposing private conversation data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请勿粘贴 API Key、访问令牌、SQLite 数据库或未脱敏的真实对话。"
  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag, commit, or plugin version.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Codex plugin, MCP stdio, MCP HTTP, standalone panel, other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide fully redacted steps, input, actual result, and expected result.
    validations:
      required: true
