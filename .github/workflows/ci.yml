name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:repository
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:plugin
      - run: npm run test:mcp

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t knowledge-copilot:ci .
      - run: docker run -d --name knowledge-copilot-ci -p 3210:3210 knowledge-copilot:ci
      - name: Verify container readiness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3210/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs knowledge-copilot-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm --force knowledge-copilot-ci || true
