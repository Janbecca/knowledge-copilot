[package]
name = "knowledge-copilot-companion"
version = "0.1.0"
description = "Always-on-top desktop companion for Knowledge Copilot"
authors = ["Knowledge Copilot Contributors"]
edition = "2021"

[lib]
name = "knowledge_copilot_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
